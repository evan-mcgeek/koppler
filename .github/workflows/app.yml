name: App

# Runs on pull requests only: a merge to main holds what its pull request already checked. Run it by hand for main
# when in doubt (Actions, App, Run workflow).
on:
  pull_request:
    paths: [app/**, .github/workflows/app.yml]
  workflow_dispatch:
  # A release runs it first: nothing is published that did not pass it.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  # One job: each job is billed by the started minute and installs everything again.
  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run types
      - name: Format
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx vitest run
      - name: End-to-end tests
        run: node --test --test-concurrency=1 test/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Canvas in a browser
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: canvas-traces
          path: app/test-results
          retention-days: 7
      - name: Script syntax
        run: |
          for f in dist/*.mjs dist/*.js dist/core/*.js; do node --check "$f"; done
          for f in bin/*; do if head -1 "$f" | grep -q bash; then bash -n "$f"; fi; done
      - name: The command starts
        run: |
          node dist/koppler.mjs --help > /dev/null
          node dist/koppler.mjs --version
      - name: Package holds the app and nothing else
        shell: python
        run: |
          import json, subprocess, sys
          files = {f["path"] for f in json.loads(subprocess.check_output(["npm", "pack", "--dry-run", "--json"], text=True))[0]["files"]}
          failed = False
          for need in ("package.json", "dist/koppler.mjs", "dist/page/index.html", "dist/status-watch.mjs", "dist/paths.js", "skills/koppler-run/SKILL.md", "skills/koppler-run/VERSION"):
              if need not in files: print(f"::error::{need} is missing from the package"); failed = True
          for f in sorted(files):
              if f.startswith(("test/", "src/", "e2e/", "scripts/", "node_modules/")) or ".test." in f or f.startswith("."):
                  print(f"::error::{f} should not be in the package"); failed = True
          print(f"{len(files)} files in the package")
          sys.exit(failed)
