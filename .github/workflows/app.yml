name: App

# Runs on pull requests only: a merge to main holds what its pull request already checked. Run it by hand for main
# when in doubt (Actions, App, Run workflow).
on:
  pull_request:
    paths: [app/**, .github/workflows/app.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  # In parallel: the repo is public, so jobs cost nothing, and the slowest part sets how long a check takes.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run types
      - name: Format
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx vitest run
      - name: Script syntax
        run: |
          for f in dist/*.mjs dist/*.js dist/core/*.js; do node --check "$f"; done
          for f in bin/*; do if head -1 "$f" | grep -q bash; then bash -n "$f"; fi; done
      - name: The command starts
        run: |
          node dist/koppler.mjs --help > /dev/null
          node dist/koppler.mjs --version
      - name: Package holds the app and nothing else
        shell: python
        run: |
          import json, subprocess, sys
          files = {f["path"] for f in json.loads(subprocess.check_output(["npm", "pack", "--dry-run", "--json"], text=True))[0]["files"]}
          failed = False
          for need in ("package.json", "dist/koppler.mjs", "dist/page/index.html", "dist/status-watch.mjs", "dist/paths.js", "skills/koppler-run/SKILL.md", "skills/koppler-run/VERSION"):
              if need not in files: print(f"::error::{need} is missing from the package"); failed = True
          for f in sorted(files):
              if f.startswith(("test/", "src/", "e2e/", "scripts/", "node_modules/")) or ".test." in f or f.startswith("."):
                  print(f"::error::{f} should not be in the package"); failed = True
          print(f"{len(files)} files in the package")
          sys.exit(failed)

  commands:
    name: End-to-end tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: End-to-end tests
        # Every third file, one file at a time: the files of one job share this machine's ports and folders.
        run: node --test --test-concurrency=1 $(ls test/*.test.mjs | awk 'NR % 3 == ${{ matrix.shard }} - 1')
        # A run reads each app's first seconds of log: one second in the tests.
        env:
          KOPPLER_EARLY_LOG: '1'

  canvas:
    name: Canvas in a browser (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # The browser and the system packages it needs come in the image: installing them took from 16 s to over 5 min.
    # Its version is @playwright/test's in package-lock.json; change both together.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Canvas in a browser
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: canvas-traces-${{ matrix.shard }}
          path: app/test-results
          retention-days: 7

  # One result for the pull request, as before: it passes when every part does.
  app:
    name: App
    if: always()
    needs: [checks, commands, canvas]
    runs-on: ubuntu-latest
    # Nothing is checked out here, so there is no app folder to run in.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every part passed
        run: |
          echo 'checks: ${{ needs.checks.result }}, end-to-end: ${{ needs.commands.result }}, canvas: ${{ needs.canvas.result }}'
          test '${{ needs.checks.result }}' = success
          test '${{ needs.commands.result }}' = success
          test '${{ needs.canvas.result }}' = success
