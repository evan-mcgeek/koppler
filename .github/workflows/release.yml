name: Release

# Merging a version bump (a "Koppler x.y.z" pull request, from `npm run release` in app/) releases it. On main, this
# tags the merge commit v<version> and starts itself again on that tag; on the tag, it publishes the version to npm as
# `latest`, with provenance, and to GitHub Packages as @evan-mcgeek/koppler, and makes its GitHub Release linking both.
# Publishing runs on the tag because the npm environment deploys only from v* tags, with a reviewer's approval.
# npm trusts this workflow (trusted publishing); until it is set up for the package, an NPM_TOKEN secret (a granular
# token) is used instead. Run by hand on main, it releases a version whose tag is not made yet; on a tag, it publishes
# that tag again.
on:
  push:
    branches: [main]
    paths: [app/package.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Any other change to package.json keeps its version, whose tag is there already: nothing to release, nothing to approve.
  tag:
    name: Tag a new version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag it, and publish from the tag
        run: |
          tag="v$(node -p "require('./app/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is released already"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Koppler ${tag#v}"
          git push origin "$tag"
          # A tag pushed with the workflow's own token starts no workflow; a dispatch does.
          gh workflow run release.yml --ref "$tag"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      packages: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # npm 11, which publishes through trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: The tag is the package's version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # GitHub Packages takes only scoped names: the same package, published under the repo owner's scope.
      - name: Publish to GitHub Packages
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm pkg set name=@evan-mcgeek/koppler
          npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: GitHub Release
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="Install with \`npm i -g koppler@$version\`.

          - npm: https://www.npmjs.com/package/koppler/v/$version
          - GitHub Packages: https://github.com/${GITHUB_REPOSITORY}/pkgs/npm/koppler"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Koppler $version" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
