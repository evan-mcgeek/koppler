name: Release

# Merging a version bump (a "Koppler x.y.z" pull request, from `npm run release` in app/) releases it: this tags the
# merge commit v<version>, publishes that version to npm as `latest`, with provenance, and to GitHub Packages as
# @evan-mcgeek/koppler, and makes its GitHub Release linking both. npm trusts this workflow (trusted publishing); until
# it is set up for the package, an NPM_TOKEN secret (a granular token) is used instead.
on:
  push:
    branches: [main]
    paths: [app/package.json]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Any other change to package.json keeps its version, whose tag is there already: nothing to release, nothing to approve.
  version:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: |
          tag="v$(node -p "require('./app/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is released already"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish
    needs: version
    if: needs.version.outputs.tag
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      packages: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # npm 11, which publishes through trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Pushed with the workflow's own token, so it starts no other workflow; a re-run finds it there.
      - name: Tag the release
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Koppler ${TAG#v}"
          git push origin "$TAG"
        env:
          TAG: ${{ needs.version.outputs.tag }}
      - name: Publish to npm
        run: npm publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # GitHub Packages takes only scoped names: the same package, published under the repo owner's scope.
      - name: Publish to GitHub Packages
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm pkg set name=@evan-mcgeek/koppler
          npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: GitHub Release
        run: |
          version="${TAG#v}"
          notes="Install with \`npm i -g koppler@$version\`.

          - npm: https://www.npmjs.com/package/koppler/v/$version
          - GitHub Packages: https://github.com/${GITHUB_REPOSITORY}/pkgs/npm/koppler"
          gh release create "$TAG" --verify-tag --generate-notes --title "Koppler $version" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
