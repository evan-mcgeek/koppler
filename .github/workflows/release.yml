name: Release

# A version tag (v0.0.2, made by `npm version` in app/) publishes that version to npm as `latest`, with provenance,
# and to GitHub Packages as @evan-mcgeek/koppler, and makes its GitHub Release linking both. npm trusts this workflow (trusted publishing); until it is set up for the package, an
# NPM_TOKEN secret (a granular token) is used instead.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# The tag is on main, whose changes passed the App workflow in their pull requests (the release commit only bumps the
# version): the tests are not run again here.
jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      packages: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # npm 11, which publishes through trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: The tag is the package's version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # GitHub Packages takes only scoped names: the same package, published under the repo owner's scope.
      - name: Publish to GitHub Packages
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm pkg set name=@evan-mcgeek/koppler
          npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: GitHub Release
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="Install with \`npm i -g koppler@$version\`.

          - npm: https://www.npmjs.com/package/koppler/v/$version
          - GitHub Packages: https://github.com/${GITHUB_REPOSITORY}/pkgs/npm/koppler"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Koppler $version" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
